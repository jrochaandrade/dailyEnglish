name: daily_english
description: A personal English learning dictionary.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.2
  path: ^1.9.0
  go_router: ^14.2.7
  google_fonts: ^6.1.0
  http: ^1.2.0
  flutter_tts: ^4.0.2
  share_plus: any
  path_provider: ^2.1.5
  file_picker: 8.1.0
  flame: ^1.35.1
  flame_tiled: ^3.0.11
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/tiles/
